name: Obtener portada de Lost in the Amazon
on:
  push:
    branches: [main]
    paths: [".github/workflows/amazon-cover.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install requests beautifulsoup4 pillow
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from io import BytesIO
          r=requests.get("https://www.curseforge.com/minecraft/mc-mods/lost-in-the-amazon",timeout=30,headers={"User-Agent":"Mozilla/5.0"})
          r.raise_for_status()
          soup=BeautifulSoup(r.text,"html.parser")
          meta=soup.find("meta",property="og:image")
          if not meta or not meta.get("content"):
              raise RuntimeError("No se encontró la portada")
          img=requests.get(meta["content"],timeout=30)
          img.raise_for_status()
          Image.open(BytesIO(img.content)).convert("RGB").save("assets/lost-in-the-amazon-cover.png")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lost-in-the-amazon-cover.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Guardar portada original de Lost in the Amazon"
          git pull --rebase
          git push
